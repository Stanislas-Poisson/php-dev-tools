version: 2
updates:
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # The packages held back are the ones of the dependency policy: update-dependencies dependabot-sync keeps this block.
    # BEGIN dependency-policy (composer)
    ignore:
      - dependency-name: "driftingly/rector-laravel"
    # END dependency-policy (composer)

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /docs
    target-branch: develop
    schedule:
      interval: weekly
    # Only the security updates: no version update is opened for this directory.
    open-pull-requests-limit: 0

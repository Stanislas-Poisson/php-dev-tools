name: Bug report
description: A command fails, or a tool gives a result that it should not.
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Command
      description: The command you ran, for example `vendor/bin/php-dev-tools quality`.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output and error
      description: What the command printed. Please remove anything private.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
      description: For example 8.4.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Version or commit of php-dev-tools, operating system, and the files of the project that extend the base ones.
